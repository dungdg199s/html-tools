<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Con Đường Tiến Hoá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#e7b866; --ink:#2b2118; --panel:#fff6e3; --green:#5fbf3a; --green-d:#3e8f22;
  --red:#e2474f; --gold:#ffcf3f; color-scheme:light;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; overflow:hidden; background:var(--sand); color:var(--ink);
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif; user-select:none; -webkit-user-select:none}
#app{display:flex; flex-direction:column; height:100%; max-width:560px; margin:0 auto}
header{display:flex; align-items:center; gap:8px; padding:10px 16px 6px}
.pill{background:rgba(43,33,24,.82); color:#fff; border-radius:999px; padding:6px 12px;
  font-weight:900; font-size:15px; display:flex; align-items:center; gap:6px; white-space:nowrap}
.pill small{font-weight:800; opacity:.7; font-size:12px}
.gate{flex:1; min-width:0}
.bar{height:12px; flex:1; border-radius:6px; background:#5b2328; overflow:hidden; min-width:40px}
.bar i{display:block; height:100%; background:linear-gradient(90deg,#7be04a,#3fbf2a); transition:width .2s}
.iconbtn{border:0; background:rgba(43,33,24,.82); color:#fff; font:inherit; font-weight:900; font-size:15px;
  border-radius:999px; height:34px; min-width:40px; padding:0 10px; cursor:pointer}
#wrap{flex:1; position:relative; min-height:0}
canvas{position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block}
#banner{position:absolute; left:0; right:0; top:8px; text-align:center; pointer-events:none;
  font-weight:900; font-size:26px; color:#fff; text-shadow:0 3px 0 #6b3d12, 0 0 12px rgba(0,0,0,.25);
  opacity:0; transition:opacity .3s}
footer{display:flex; gap:10px; padding:8px 16px 14px; align-items:stretch}
#summon{flex:1; border:0; border-radius:18px; padding:12px; cursor:pointer; font:inherit; color:#fff;
  background:linear-gradient(#7fd44c,#4aa52a); box-shadow:0 5px 0 #2f7a18; font-weight:900; font-size:20px;
  display:flex; flex-direction:column; align-items:center; line-height:1.1}
#summon small{font-size:14px; font-weight:800; opacity:.95}
#summon:active{transform:translateY(3px); box-shadow:0 2px 0 #2f7a18}
#summon:disabled{filter:grayscale(.7) brightness(.9); cursor:not-allowed}
.side{display:flex; flex-direction:column; gap:8px; width:84px}
.side button{flex:1; border:0; border-radius:14px; font:inherit; font-weight:900; font-size:15px; color:#fff;
  background:#b8742e; box-shadow:0 4px 0 #7a4612; cursor:pointer}
.side button:active{transform:translateY(2px); box-shadow:0 2px 0 #7a4612}
#over{position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(30,18,8,.55)}
#over .card{background:var(--panel); border-radius:22px; padding:24px 28px; text-align:center; max-width:300px;
  box-shadow:0 8px 0 #b8742e}
#over h2{margin:0 0 6px; font-size:28px}
#over p{margin:4px 0; font-weight:800}
#over button{margin-top:14px; border:0; border-radius:14px; padding:12px 24px; font:inherit; font-weight:900;
  font-size:18px; color:#fff; background:linear-gradient(#7fd44c,#4aa52a); box-shadow:0 4px 0 #2f7a18; cursor:pointer}
#choose{position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(30,18,8,.6); z-index:5}
#choose .card{background:var(--panel); border-radius:22px; padding:18px; width:min(360px,92%); box-shadow:0 8px 0 #b8742e; text-align:center}
#choose h2{margin:0 0 4px; font-size:22px}
#choose p{margin:0 0 12px; font-weight:800; color:#8a5a2b; font-size:14px}
#chooseList{display:grid; grid-template-columns:1fr 1fr; gap:8px}
#chooseList button{border:0; border-radius:14px; padding:10px 6px; font:inherit; font-weight:900; font-size:15px; color:var(--ink);
  background:#fff; box-shadow:0 3px 0 #d9c7a3; cursor:pointer; line-height:1.2}
#chooseList button i{font-style:normal; font-size:24px; display:block}
#chooseList button small{display:block; font-weight:800; font-size:11.5px; color:#8a5a2b}
#chooseList button:active{transform:translateY(2px); box-shadow:0 1px 0 #d9c7a3}
#tools{display:flex; gap:8px; padding:0 16px}
#tools button{flex:1; border:0; border-radius:12px; padding:7px 4px; font:inherit; font-weight:900; font-size:13px; color:#fff;
  background:#8a5a2b; box-shadow:0 3px 0 #5a3410; cursor:pointer; line-height:1.15}
#tools button small{display:block; font-size:11px; font-weight:800; opacity:.9}
#tools button.on{background:#4aa52a; box-shadow:0 3px 0 #2f7a18}
#tools button:disabled{filter:grayscale(.6) brightness(.9); cursor:not-allowed}
#tools button:active{transform:translateY(2px); box-shadow:0 1px 0 #5a3410}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="pill">🌊 <span id="wave">1</span></div>
    <div class="pill">🪙 <span id="coins">0</span></div>
    <div class="pill gate">🚐 <div class="bar"><i id="gatebar"></i></div><small id="gatetxt"></small></div>
  </header>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="banner"></div>
    <div id="choose"><div class="card">
      <h2>✨ Tiến hoá! ✨</h2>
      <p id="chooseSub">Chọn hướng tiến hoá</p>
      <div id="chooseList"></div>
    </div></div>
    <div id="over"><div class="card">
      <h2>Thua rồi! 🧟</h2>
      <p>Trụ được tới wave <span id="ow">1</span></p>
      <p>Kỷ lục: wave <span id="ob">1</span></p>
      <button id="again">Chơi lại</button>
    </div></div>
  </div>
  <div id="tools">
    <button id="auto">🔀 Auto gộp<small id="autotxt">TẮT</small></button>
    <button id="bench">🪑 Ô chờ<small>🪙 <span id="benchcost">100</span></small></button>
    <button id="space">🗺️ Mở rộng<small>🪙 <span id="spacecost">1.5K</span></small></button>
  </div>
  <footer>
    <button id="summon">Triệu hồi<small>🪙 <span id="cost">10</span></small></button>
    <div class="side">
      <button id="speed">x1</button>
      <button id="pause">⏸</button>
    </div>
    <div class="side" style="width:52px">
      <button id="sound">🔊</button>
      <button id="restart" title="Chơi lại">↺</button>
    </div>
  </footer>
</div>
<script>
(() => {
// ---------- world layout ----------
const TW = 44, A0 = -Math.PI / 2 - 0.05;      // track width; zombies enter here (top, left of gate)
const SLOT_R = 23, MAXL = 6, MAX_BENCH = 6;   // two MAXL critters fuse into a legend
// arena layouts, bought with the "Mở rộng" button: bigger field, more slots, longer track
const LAYOUTS = [
  { tr: 166, rows: [3, 4, 5, 4, 3], dy: 48, cost: 1500 },
  { tr: 200, rows: [3, 4, 5, 6, 5, 4, 3], dy: 46, cost: 15000 },
  { tr: 236, rows: [3, 4, 5, 6, 7, 6, 5, 4, 3], dy: 44 },
];
let W, H, CX, CY, TR, GR, LAP, GATE_A, K = 1, NA = 0, SLOTS = [];
let grassDots = [];
function applyLayout(li, benchN) {
  const L = LAYOUTS[li], half = L.tr + TW / 2 + 12;
  TR = L.tr; GR = TR - 26; K = TR / 166;
  W = half * 2; CX = W / 2; CY = half + 18; H = CY + TR + TW / 2 + 70;
  LAP = TR * (2 * Math.PI - 0.42);              // distance until they reach the gate
  GATE_A = A0 - LAP / TR;
  SLOTS = [];
  L.rows.forEach((n, r) => {
    for (let i = 0; i < n; i++) SLOTS.push({ x: CX + (i - (n - 1) / 2) * 54, y: CY + (r - (L.rows.length - 1) / 2) * L.dy });
  });
  NA = SLOTS.length;
  const by = CY + TR + TW / 2 + 36;
  for (let i = 0; i < benchN; i++) SLOTS.push({ x: CX + (i - (benchN - 1) / 2) * 54, y: by, bench: true });
  grassDots = [];
  for (let i = 0; i < 40 * K * K; i++) {
    const a = rnd(0, 7), d = rnd(0, GR - 10);
    grassDots.push({ x: CX + Math.cos(a) * d, y: CY + Math.sin(a) * d });
  }
  resize();
}

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let scale = 1, ox = 0, oy = 0, dpr = 1;

function resize() {
  const r = $('wrap').getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  scale = Math.min(r.width / W, r.height / H);
  ox = (r.width - W * scale) / 2; oy = (r.height - H * scale) / 2;
}
window.addEventListener('resize', resize);

// ---------- decorations (static) ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
function wpick(keys, wf) {
  let tot = 0; const ws = keys.map(k => { const w = Math.max(0, wf(k)); tot += w; return w; });
  if (tot <= 0) return null;
  let r = Math.random() * tot;
  for (let i = 0; i < keys.length; i++) if ((r -= ws[i]) <= 0) return keys[i];
  return keys[keys.length - 1];
}
// tufts and decor are in base-layout coordinates (arena centre 200,218) and scaled with the arena
const tufts = [];
for (let i = 0; i < 160; i++) {
  const x = rnd(-250, 650), y = rnd(-350, 780);
  if (Math.hypot(x - 200, y - 218) < 196) continue;
  tufts.push({ x, y, s: rnd(.7, 1.2) });
}

// ---------- sound ----------
let actx = null, muted = false;
try { muted = localStorage.getItem('cd-muted') === '1'; } catch (e) {}
function beep(f, dur = .08, type = 'square', vol = .05, slide = 0) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}

// ---------- critter types ----------
const TYPES = {
  leek:   { vi: 'Hành Ném',   w: 30, unlock: 1, dmg: 1,   rate: 1,    range: 0,   accent: '#e85a82' },
  chili:  { vi: 'Ớt Nổ',      w: 18, unlock: 1, dmg: .7,  rate: 1.3,  range: -10, accent: '#ff4a2a' },
  ice:    { vi: 'Băng Tuyết', w: 14, unlock: 1, dmg: .4,  rate: .9,   range: 0,   accent: '#7fd8ff' },
  durian: { vi: 'Sầu Riêng',  w: 12, unlock: 3, dmg: .35, rate: 1.25, range: 0,   accent: '#8a9a2a' },
  piggy:  { vi: 'Heo Đất',    w: 8,  unlock: 3, dmg: 0,   rate: 0,    range: 0,   accent: '#ff9ac2' },
  bolt:   { vi: 'Sấm Sét',    w: 10, unlock: 5, dmg: .75, rate: 1.15, range: -15, accent: '#ffd23f' },
  drum:   { vi: 'Trống Hội',  w: 8,  unlock: 5, dmg: 0,   rate: 0,    range: 0,   accent: '#b5651d' },
  // melee: hit what their weapon physically reaches
  sword:  { vi: 'Kiếm Xoay',  w: 14, unlock: 2, dmg: .9,  rate: 0,    range: 0,   accent: '#c0c8d0', melee: true },
  spear:  { vi: 'Giáo Đâm',   w: 10, unlock: 4, dmg: 3.2, rate: 0,    range: 0,   accent: '#3c9a2a', melee: true },
  hammer: { vi: 'Búa Tạ',     w: 9,  unlock: 6, dmg: 2.6, rate: 0,    range: 0,   accent: '#8a96a3', melee: true },
  shield: { vi: 'Khiên Gai',  w: 7,  unlock: 7, dmg: .35, rate: 0,    range: 0,   accent: '#a0622a', melee: true },
};
const critDmg = l => Math.round(Math.pow(2.25, l - 1));
const critRate = l => Math.max(.4, .85 - .03 * l);
const critRange = l => 215 + l * 6;
const tDmg = (k, l, buff = 0) => Math.max(1, Math.round(critDmg(l) * TYPES[k].dmg * (1 + buff)));
const tRate = (k, l) => critRate(l) * TYPES[k].rate;
const tRange = (k, l) => (critRange(l) + TYPES[k].range) * K;
const critter = (lvl, kind = 'leek') => ({ type: 'c', kind, lvl, cd: rnd(0, .5), bounce: 0, throwT: 0, pop: 1, buff: 0, gen: 8, beat: 1, stun: 0, stunKind: 'daze' });
// v2: only two base branches are summoned; the rest are evolution choices at MAXL
const BASES = { leek: { vi: 'Xạ Thủ', branch: 'ranged' }, sword: { vi: 'Kiếm Xoay', branch: 'melee' } };
const rollKind = () => Math.random() < .55 ? 'leek' : 'sword';
const branchOf = k => TYPES[k].melee ? 'melee' : 'ranged';
const EVO = {
  ranged: [['leek', '🧅', 'Bắn nhanh, đánh đơn'], ['chili', '🌶️', 'Nổ lan'], ['ice', '❄️', 'Làm chậm'], ['durian', '🍈', 'Độc, xuyên giáp'],
    ['bolt', '⚡', 'Sét lan nhiều con'], ['piggy', '🐷', 'Không đánh, ra xu'], ['drum', '🥁', 'Tăng ST lính quanh']],
  melee: [['sword', '⚔️', 'Kiếm xoay quanh'], ['spear', '🔱', 'Đâm xuyên giáp'], ['hammer', '🔨', 'Đập lan, đẩy lùi'], ['shield', '🛡️', 'Gai + làm chậm']],
};
const critName = c => c.legend ? legendName(c.key) : (c.lvl < MAXL || c.pick) ? BASES[c.kind] ? BASES[c.kind].vi : TYPES[c.kind].vi : TYPES[c.kind].vi;
// stars: 5 tiers (trắng, xanh, vàng, đỏ, tím) of 5 stars each
const TIERS = [
  { n: 'Trắng', c: '#ffffff', d: '#6b6b6b' }, { n: 'Xanh', c: '#4aa8ff', d: '#0b3d7a' }, { n: 'Vàng', c: '#ffd23f', d: '#7a4a00' },
  { n: 'Đỏ', c: '#ff3c3c', d: '#5a0a0a' }, { n: 'Tím', c: '#c060ff', d: '#3a0a5a' },
];
const MAX_STAR = TIERS.length * 5;
const tierOf = star => Math.min(TIERS.length - 1, Math.floor((star - 1) / 5));
// damage grows hard: x1.6 per star and x2 more for each new tier
const starPow = star => Math.pow(1.6, star - 1) * Math.pow(2, tierOf(star));

// ---------- zombie types ----------
const ZTYPES = {
  walk:   { vi: 'Xác Sống',    hp: 1,   spd: 38, r: 1,    gold: 1,   dmg: 1, gap: 1,   cost: 1,   first: 1 },
  run:    { vi: 'Chạy Bộ',     hp: .7,  spd: 62, r: .95,  gold: 1,   dmg: 1, gap: 1,   cost: 1,   first: 2, overtake: true },
  tank:   { vi: 'Pyjama Bự',   hp: 3,   spd: 27, r: 1.15, gold: 3,   dmg: 2, gap: 1.5, cost: 2.5, first: 3, armor: .35, slowRes: .5 },
  helmet: { vi: 'Mũ Bảo Hiểm', hp: .8,  spd: 36, r: 1,    gold: 2,   dmg: 1, gap: 1.1, cost: 1.6, first: 4, shield: 1 },
  tiny:   { vi: 'Zombie Nhí',  hp: .3,  spd: 50, r: .7,   gold: .35, dmg: 1, gap: .4,  cost: .35, first: 5 },
  fatty:  { vi: 'Bụng Bự',     hp: 2,   spd: 30, r: 1.25, gold: 1.5, dmg: 2, gap: 1.4, cost: 2.2, first: 6, split: 2 },
  nurse:  { vi: 'Y Tá Zombie', hp: 1.2, spd: 34, r: 1,    gold: 2.5, dmg: 1, gap: 1.2, cost: 2,   first: 8 },
  ghost:  { vi: 'Ma Lơ Lửng',  hp: .9,  spd: 44, r: .95,  gold: 2,   dmg: 1, gap: 1,   cost: 1.8, first: 10 },
  bomber: { vi: 'Ôm Bom',      hp: 1.1, spd: 40, r: 1,    gold: 2,   dmg: 3, gap: 1.2, cost: 2,   first: 12 },
};
const BASEW = { run: 22, tank: 14, helmet: 16, tiny: 12, fatty: 10, nurse: 6, ghost: 10, bomber: 8 };
const THEMES = [
  { n: 'Đội Mũ Sắt', k: ['helmet', 'tank'] },
  { n: 'Bầy Nhí!', k: ['tiny', 'fatty'], mul: 1.3 },
  { n: 'Bệnh Viện', k: ['nurse', 'fatty', 'tank'] },
  { n: 'Đêm Ma', k: ['ghost', 'run'] },
  { n: 'Bom Bom', k: ['bomber', 'run'] },
];
const HEAVY = { tank: 1, fatty: 1, nurse: 1, bomber: 1 };

// ---------- bosses ----------
const BOSSES = [
  { id: 'king', name: 'Vua Xác Sống', hp: 14, spd: 20, dmg: 6, r: 1.8, abil: [{ k: 'summon', cd: 7, cast: 1, n: 3 }, { k: 'enrage', at: .5, mul: 1.6 }] },
  { id: 'chef', name: 'Bà Đồ Tể', hp: 16, spd: 18, dmg: 6, r: 1.75, abil: [{ k: 'jar', cd: 6, warn: 1 }, { k: 'stun', cd: 8, warn: 1.2, dur: 3 }] },
  { id: 'babi', name: 'Ông Ba Bị', hp: 18, spd: 22, dmg: 7, r: 1.9, abil: [{ k: 'grab', cd: 10, warn: 1.5 }, { k: 'jump', cd: 9, cast: .8, dist: 110 }] },
  { id: 'mada', name: 'Ma Da', hp: 15, spd: 19, dmg: 5, r: 1.7, abil: [{ k: 'shield', at: [.75, .35], adds: 3 }, { k: 'heal', cd: 9, cast: 1, pct: .03, dur: 4 }] },
  { id: 'trau', name: 'Trâu Điên', hp: 20, spd: 16, dmg: 8, r: 2.0, armor: .3, abil: [{ k: 'charge', cd: 8, cast: 1, mul: 3.5, dur: 1.5 }, { k: 'stomp', cd: 10, warn: 1.2, n: 3, dur: 2 }] },
];
const bossDef = w => BOSSES[(w / 5 - 1) % BOSSES.length];

// ---------- state ----------
let S, best = 0;
try { best = +localStorage.getItem('cd2-best') || 0; } catch (e) {}

function newGame() {
  S = {
    wave: 0, coins: 30, gate: 20, gateMax: 20, summons: 0, grid: [],
    zombies: [], shots: [], parts: [], texts: [], fx: [], warns: [], queue: [], spawnT: 0, breakT: 2, over: false,
    paused: false, speed: S ? S.speed : 1, shake: 0, time: 0, hitBeep: 0,
    layout: 0, benchN: 0, auto: S ? S.auto : false, autoT: 0, pickQ: []
  };
  applyLayout(0, 0);
  S.grid = Array(SLOTS.length).fill(null);
  S.grid[7] = critter(1, 'leek'); S.grid[11] = critter(1, 'sword');
  $('over').style.display = 'none'; $('choose').style.display = 'none'; choosing = null;
  $('pause').textContent = '⏸';
  hud();
  banner('Gộp lính cùng loại, cùng cấp · cấp MAX được chọn hướng tiến hoá', 3.5);
}
const summonCost = () => 10 + S.summons * 3;
const waveActive = () => S.queue.length > 0 || S.zombies.length > 0;

function fmt(n) {
  n = Math.ceil(n);
  if (n < 1000) return '' + n;
  if (n < 1e6) return (n / 1000).toFixed(n < 1e4 ? 1 : 0).replace(/\.0$/, '') + 'K';
  return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
}

// ---------- zombies ----------
function zHp(w) { return Math.max(1, Math.round(1 + (w - 1) * 1.1 + .12 * w * w + Math.pow(1.12, w) - 1.12)); }
function baseZombie(o) {
  return Object.assign({ pend: 0, d: 0, flash: 0, step: rnd(0, 6), armor: 0, shield: 0, shieldMax: 0,
    slowM: 1, slowT: 0, frzT: 0, slowRes: 0, psn: 0, psnT: 0, psnTick: .5, phaseT: rnd(0, 3.6), phased: false,
    lane: 0, laneCur: 0, blockT: 0, overT: 0, healT: 2, isBoss: false }, o);
}
function makeZombie(kind, w, o = {}) {
  if (kind === 'boss') return makeBoss(w);
  const T = ZTYPES[kind], h = zHp(w);
  const hp = Math.max(1, Math.round(h * T.hp * (o.hpMul || 1)));
  const z = baseZombie({ kind, T, hp, max: hp, spd: T.spd, r: T.r, dmg: T.dmg, d: o.d || 0,
    gold: o.noGold ? 0 : Math.max(1, Math.round(T.gold * (1 + h * .45))),
    armor: T.armor || 0, slowRes: T.slowRes || 0 });
  if (T.shield) z.shield = z.shieldMax = Math.max(1, Math.round(h * T.shield));
  return z;
}
function makeBoss(w) {
  const def = bossDef(w), tier = Math.floor((w / 5 - 1) / BOSSES.length), h = zHp(w);
  const hp = Math.round(h * def.hp * (1 + .6 * tier));
  return baseZombie({ kind: 'boss', isBoss: true, def, tier, hp, max: hp, spd: def.spd, baseSpd: def.spd, r: def.r,
    dmg: def.dmg, gold: Math.round(15 * (1 + h * .45) * 1.5), armor: def.armor || 0, slowRes: .5,
    cds: def.abil.map(a => (a.cd || 0) * .5), state: 'walk', stT: 0, sack: [], adds: [], immune: false,
    enraged: false, shieldIdx: 0, chargeMul: 1, cast: null });
}

function updateCritters(dt) {

  S.grid.forEach((d, j) => {
    if (j >= NA || !isCrit(d) || !has(d, 'drum') || d.stun > 0 || d.fuseT > 0) return;

    S.grid.forEach((c, i) => {

      if (Math.hypot(SLOTS[i].x - SLOTS[j].x, SLOTS[i].y - SLOTS[j].y) > a.rad) return;

  rrect(-40, -18, 86, 18, [10, 10, 0, 0], '#f4ead2', '#4a1a14', 2);
  ctx.fillStyle = '#9fd6f0'; ctx.fillRect(-32, -12, 18, 10); ctx.fillRect(-8, -12, 18, 10); ctx.fillRect(16, -12, 22, 10);
  circle(-20, 28, 8, '#333'); circle(28, 28, 8, '#333'); circle(-20, 28, 3, '#aaa'); circle(28, 28, 3, '#aaa');
  ctx.restore();
  [[-10, 405, 34], [395, 395, 40], [30, 30, 20]].forEach(([x, y, r]) => { ell(x, y, r, r * .6, '#c9773b', '#7a4116', 2); ell(x - r * .2, y - r * .2, r * .5, r * .25, '#e09456'); });
  [[22, 360], [10, 120]].forEach(([x, y]) => { ell(x, y, 13, 9, '#3f3f3f'); ell(x, y, 5, 3, '#c79a55'); });
}

function render() {
  const cw = cv.width, ch = cv.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#e7b866'; ctx.fillRect(0, 0, cw, ch);
  const sh = S.shake ? rnd(-S.shake, S.shake) : 0;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (ox + sh), dpr * oy);
  ctx.save(); ctx.translate(CX, CY); ctx.scale(K, K); ctx.translate(-200, -218);
  ctx.strokeStyle = 'rgba(160,100,40,.45)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  for (const t of tufts) {
    ctx.beginPath();
    ctx.moveTo(t.x - 4 * t.s, t.y); ctx.lineTo(t.x - 5 * t.s, t.y - 5 * t.s);
    ctx.moveTo(t.x, t.y); ctx.lineTo(t.x, t.y - 7 * t.s);
    ctx.moveTo(t.x + 4 * t.s, t.y); ctx.lineTo(t.x + 5 * t.s, t.y - 5 * t.s); ctx.stroke();
  }
  drawDecor();
  ctx.restore();
  drawWorld();
  const ents = [];
  S.grid.forEach((c, i) => { if (c && !(drag && drag.from === i)) ents.push({ y: SLOTS[i].y, f: () => isCrit(c) ? drawCritter(SLOTS[i].x, SLOTS[i].y, c) : drawBarrel(SLOTS[i], c) }); });
  for (const z of S.zombies) { const p = zPos(z); ents.push({ y: p.y, f: () => drawZombie(z) }); }
  ents.sort((a, b) => a.y - b.y).forEach(e => e.f());
  drawMelee();
  drawWarns();
  for (const s of S.shots) drawShot(s);
  drawFx();
  for (const p of S.parts) { ctx.globalAlpha = Math.min(1, p.life * 2); circle(p.x, p.y, p.r, p.c); }
  ctx.globalAlpha = 1;
  for (const t of S.texts) { ctx.globalAlpha = Math.min(1, t.life * 2); label(t.s, t.x, t.y, t.size, t.c, '#3a2410'); }
  ctx.globalAlpha = 1;
  if (drag) {
    const c = S.grid[drag.from];
    if (c) {
      const r = meleeReach(c);
      if (r) circle(drag.x, drag.y, r, 'rgba(225,232,240,.12)', 'rgba(225,232,240,.6)', 2);
      drawCritter(drag.x, drag.y - 10, c, 1.15, true);
    }
    if (fuseHover) label(fuseHover.t, fuseHover.s.x, fuseHover.s.y - 58, 14, '#ffd23f', '#5a3000');
  }
  drawBossBar();
  if (!S.queue.length && !S.zombies.length && S.breakT > 0 && !S.over) {
    label('Wave ' + (S.wave + 1) + ' sau ' + Math.ceil(S.breakT) + 's', CX, CY - GR - 2, 15, '#fff', '#6b3d12');
  }
  if (S.paused && !S.over) label('TẠM DỪNG', CX, CY, 34, '#fff', '#6b3d12');
}

// ---------- input ----------
let drag = null;
function toWorld(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left - ox) / scale, y: (e.clientY - r.top - oy) / scale };
}
cv.addEventListener('pointerdown', e => {
  if (S.over || S.paused) return;
  const p = toWorld(e), i = slotAt(p.x, p.y);
  if (i < 0 || !S.grid[i]) return;
  const c = S.grid[i];
  if (!isCrit(c)) { hitObstacle(i, 1); return; }
  drag = { from: i, x: p.x, y: p.y, sx: p.x, sy: p.y };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => { if (drag) { const p = toWorld(e); drag.x = p.x; drag.y = p.y; } });
function endDrag(e) {
  if (!drag) return;
  const from = drag.from, c = S.grid[from], moved = Math.hypot(drag.x - drag.sx, drag.y - drag.sy);
  const p = toWorld(e), j = slotAt(p.x, p.y);
  drag = null;
  if (!c) return;
  if (j === from || (j < 0 && moved < 8)) {
    if (moved < 8) {
      const s = SLOTS[from], k = c.kind;
      if (c.pick) { needPick(c); openChoice(); return; }
      if (c.legend) {
        const st = legendStats(c);
        text(s.x, s.y - 52, `${legendName(c.key)} · ${(c.star - 1) % 5 + 1}★ ${TIERS[tierOf(c.star)].n}`, TIERS[tierOf(c.star)].c, 13);
        text(s.x, s.y - 36, (st.atk.length ? `ST ${fmt(st.dmg)}` : c.kinds.some(k => TYPES[k].melee) ? 'Cận chiến' : 'Hỗ trợ') + (LEG_INFO[c.key] ? ' · ' + LEG_INFO[c.key] : ''), '#fff', 11);
        return;
      }
      const info = k === 'piggy' ? `+${Math.round(2 * Math.pow(1.8, c.lvl - 1))}🪙/8s` : k === 'drum' ? `+${Math.round(Math.min(.6, .15 + .03 * c.lvl) * 100)}% ST` : `ST ${fmt(tDmg(k, c.lvl, c.buff))}` + (k === 'sword' ? ` · ${swordGeom(c.lvl).N} kiếm` : '');
      text(s.x, s.y - 44, `${critName(c)} · ${info}`, '#fff', 13);
    }
    return;
  }
  if (j < 0) return;
  const t = S.grid[j];
  if (!t) { S.grid[j] = c; S.grid[from] = null; c.pop = .4; }
  else if (mergeKind(c, t) === 'merge') doMerge(from, j);
  else if (mergeKind(c, t) === 'fuse') {
    const L = makeLegend(c, t);
    S.grid[j] = L; S.grid[from] = null;
    S.fx.push({ kind: 'fly', x0: SLOTS[from].x, y0: SLOTS[from].y, x1: SLOTS[j].x, y1: SLOTS[j].y, col: TYPES[c.kind].accent, life: .25, max: .25 });
    beep(300, .6, 'sine', .05, 600);
  } else if (mergeKind(c, t) === 'star') {
    const L = c.legend ? c : t;
    S.grid[j] = L; S.grid[from] = null;
    starUp(L, SLOTS[j]);
  } else if (isCrit(t)) {
    if (t.lvl === c.lvl && t.kind !== c.kind) text(SLOTS[j].x, SLOTS[j].y - 40, 'Khác loại!', '#ffb3b3', 13);
    S.grid[j] = c; S.grid[from] = t; c.pop = t.pop = .4;
  }
}
function starUp(L, s) {
  L.star++; L.pop = 1; L.stun = 0;
  const T = TIERS[tierOf(L.star)], newTier = (L.star - 1) % 5 === 0;
  burst(s.x, s.y - 8, newTier ? 50 : 24, [T.c, '#ffffff', ...L.kinds.map(k => TYPES[k].accent)]);
  text(s.x, s.y - 46, '★'.repeat((L.star - 1) % 5 + 1), T.c, 18);
  if (newTier) {
    S.fx.push({ kind: 'flash', x: s.x, y: s.y, life: .4, max: .4 });
    [90, 150, 220].forEach((r, i) => S.fx.push({ kind: 'ring', x: s.x, y: s.y, r0: 10, r1: r, col: T.c, life: .45 + i * .15, max: .45 + i * .15 }));
    S.shake = 8; banner(`⭐ Sao ${T.n}! ⭐ ${legendName(L.key)}`, 2.4);
    [392, 523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .18, 'triangle', .07), i * 80));
  } else { beep(660, .1, 'triangle', .06); setTimeout(() => beep(990, .2, 'triangle', .06), 90); }
}
// ---------- evolution choice ----------
let choosing = null;
function needPick(c) { c.pick = true; if (!S.pickQ.includes(c)) S.pickQ.push(c); }
function openChoice() {
  if (choosing || !S.pickQ.length) return;
  const c = S.pickQ.shift();
  if (!S.grid.includes(c) || !c.pick) return openChoice();
  choosing = c;
  const br = BASES[c.kind] ? BASES[c.kind].branch : branchOf(c.kind);
  $('chooseSub').textContent = `${BASES[c.kind] ? BASES[c.kind].vi : TYPES[c.kind].vi} đạt cấp MAX — chọn hướng tiến hoá`;
  $('chooseList').innerHTML = '';
  for (const [k, icon, desc] of EVO[br]) {
    const b = document.createElement('button');
    b.innerHTML = `<i>${icon}</i>${TYPES[k].vi}<small>${desc}</small>`;
    b.onclick = () => {
      c.kind = k; c.pick = false; c.pop = 1; choosing = null;
      $('choose').style.display = 'none';
      const i = S.grid.indexOf(c);
      if (i >= 0) { burst(SLOTS[i].x, SLOTS[i].y - 8, 24, [TYPES[k].accent, '#ffffff', '#ffd23f']); text(SLOTS[i].x, SLOTS[i].y - 44, TYPES[k].vi + '!', '#ffd23f', 15); }
      beep(523, .1, 'triangle', .06); setTimeout(() => beep(784, .2, 'triangle', .06), 100);
      hud(); openChoice();
    };
    $('chooseList').appendChild(b);
  }
  $('choose').style.display = 'flex';
}
function doMerge(from, j) {
  const t = S.grid[j];
  t.lvl++; t.pop = 1; t.stun = 0; S.grid[from] = null;
  S.fx.push({ kind: 'fly', x0: SLOTS[from].x, y0: SLOTS[from].y, x1: SLOTS[j].x, y1: SLOTS[j].y, col: TYPES[t.kind].accent, life: .25, max: .25 });
  burst(SLOTS[j].x, SLOTS[j].y - 8, 16, ['#ffe66b', '#ffffff', LVL_COLORS[(t.lvl - 1) % LVL_COLORS.length]]);
  text(SLOTS[j].x, SLOTS[j].y - 40, t.lvl === MAXL ? 'MAX!' : 'LV ' + t.lvl + '!', '#5be03a');
  if (t.lvl === MAXL) { needPick(t); setTimeout(openChoice, 350); }
  if (t.lvl === MAXL && !S.hintFuse && S.grid.filter(c => isCrit(c) && !c.legend && c.lvl === MAXL).length >= 2) {
    S.hintFuse = true; setTimeout(() => banner('Kéo 2 lính MAX vào nhau → Huyền Thoại!', 3), 600);
  }
  beep(440, .08, 'triangle', .06); setTimeout(() => beep(660, .08, 'triangle', .06), 70); setTimeout(() => beep(880, .12, 'triangle', .06), 140);
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', () => drag = null);

// ---------- buttons / hud ----------
function hud() {
  $('wave').textContent = Math.max(1, S.wave);
  $('coins').textContent = fmt(S.coins);
  $('cost').textContent = fmt(summonCost());
  $('gatebar').style.width = (S.gate / S.gateMax * 100) + '%';
  $('gatetxt').textContent = S.gate + '/' + S.gateMax;
  $('summon').disabled = S.coins < summonCost() || !emptySlots(true).length || S.over;
  $('autotxt').textContent = S.auto ? 'BẬT' : 'TẮT'; $('auto').classList.toggle('on', S.auto);
  const bc = benchCost(), sc = spaceCost();
  $('benchcost').textContent = bc ? fmt(bc) : 'Tối đa'; $('bench').disabled = !bc || S.coins < bc || S.over;
  $('spacecost').textContent = sc ? fmt(sc) : 'Tối đa'; $('space').disabled = !sc || S.coins < sc || S.over;
}
$('summon').onclick = () => {
  const cost = summonCost(), empty = emptySlots().length ? emptySlots() : emptySlots(true);
  if (S.coins < cost || !empty.length || S.over) return;
  S.coins -= cost; S.summons++;
  const i = pick(empty), lvl = Math.random() < .1 ? 2 : 1, kind = rollKind();
  S.grid[i] = critter(lvl, kind);
  burst(SLOTS[i].x, SLOTS[i].y, 10, ['#ffffff', TYPES[kind].accent]);
  text(SLOTS[i].x, SLOTS[i].y - 40, (lvl === 2 ? 'May mắn! ' : '+ ') + BASES[kind].vi, lvl === 2 ? '#ffe66b' : '#fff', 13);
  beep(700, .1, 'triangle', .05, 300);
  hud();
};
const benchCost = () => S.benchN >= MAX_BENCH ? 0 : Math.round(100 * Math.pow(2.5, S.benchN));
const spaceCost = () => LAYOUTS[S.layout].cost || 0;
// rebuild SLOTS for a new layout / bench size, keeping every critter and barrel
function relayout(li, benchN) {
  const oldA = S.grid.slice(0, NA).map((c, i) => c && { c, d: Math.hypot(SLOTS[i].x - CX, SLOTS[i].y - CY) }).filter(Boolean);
  const oldB = S.grid.slice(NA).filter(Boolean);
  oldA.sort((a, b) => a.d - b.d);
  const isMel = c => isCrit(c) && (c.legend ? c.kinds : [c.kind]).some(k => TYPES[k].melee);
  applyLayout(li, benchN);
  S.layout = li; S.benchN = benchN;
  S.grid = Array(SLOTS.length).fill(null);
  const order = SLOTS.slice(0, NA).map((s, i) => i).sort((i, j) => Math.hypot(SLOTS[i].x - CX, SLOTS[i].y - CY) - Math.hypot(SLOTS[j].x - CX, SLOTS[j].y - CY));
  // melee critters keep hugging the track: they take the outermost slots, everything else fills from the centre
  const mel = oldA.filter(o => isMel(o.c)), rest = oldA.filter(o => !isMel(o.c));
  mel.forEach((o, n) => { S.grid[order[order.length - 1 - n]] = o.c; o.c.pop = .6; });
  rest.forEach((o, n) => { S.grid[order[n]] = o.c; o.c.pop = .6; });
  oldB.forEach((c, n) => { S.grid[NA + n] = c; });
  S.warns = []; drag = null;
}
$('bench').onclick = () => {
  const c = benchCost();
  if (!c || S.coins < c || S.over) return;
  S.coins -= c; relayout(S.layout, S.benchN + 1);
  const s = SLOTS[SLOTS.length - 1]; burst(s.x, s.y, 12, ['#b07a3e', '#ffd23f']);
  beep(600, .12, 'triangle', .05, 200); hud();
};
$('space').onclick = () => {
  const c = spaceCost();
  if (!c || S.coins < c || S.over) return;
  if (!confirm(`Mở rộng sân với giá ${fmt(c)} xu? Sân to hơn, nhiều ô hơn, đường đi dài hơn.`)) return;
  S.coins -= c; relayout(S.layout + 1, S.benchN);
  banner(`Sân mới: ${NA} ô!`, 2); S.shake = 4;
  SLOTS.slice(0, NA).forEach(s => burst(s.x, s.y, 2, ['#c9ec6b', '#ffffff']));
  beep(392, .15, 'triangle', .06); setTimeout(() => beep(523, .15, 'triangle', .06), 120); setTimeout(() => beep(784, .3, 'triangle', .06), 240);
  hud();
};
$('auto').onclick = () => { S.auto = !S.auto; S.autoT = 0; hud(); };
// one merge per tick: the lowest-level pair of the same kind in the arena
function autoMerge() {
  let best = null;
  for (let i = 0; i < NA; i++) {
    const a = S.grid[i];
    if (!isCrit(a) || a.lvl >= MAXL || (drag && drag.from === i)) continue;
    for (let j = i + 1; j < NA; j++) {
      const b = S.grid[j];
      if (!isCrit(b) || b.kind !== a.kind || b.lvl !== a.lvl || (drag && drag.from === j)) continue;
      if (!best || a.lvl < best.lvl) best = { i, j, lvl: a.lvl };
      break;
    }
  }
  if (!best) return false;
  // ranged keeps the one nearer the centre (better reach)
  const di = Math.hypot(SLOTS[best.i].x - CX, SLOTS[best.i].y - CY), dj = Math.hypot(SLOTS[best.j].x - CX, SLOTS[best.j].y - CY);
  const outer = TYPES[S.grid[best.i].kind].melee;   // melee keeps the slot nearer the track
  const [from, to] = (di < dj) !== outer ? [best.j, best.i] : [best.i, best.j];
  doMerge(from, to);
  return true;
}
$('speed').onclick = () => { S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 3 : 1; $('speed').textContent = 'x' + S.speed; };
$('pause').onclick = () => { if (S.over) return; S.paused = !S.paused; $('pause').textContent = S.paused ? '▶' : '⏸'; };
$('sound').onclick = () => { muted = !muted; $('sound').textContent = muted ? '🔇' : '🔊'; try { localStorage.setItem('cd-muted', muted ? '1' : '0'); } catch (e) {} };
$('sound').textContent = muted ? '🔇' : '🔊';
$('again').onclick = () => { clearSave(); newGame(); };
$('restart').onclick = () => { if (S.over || confirm('Chơi lại từ đầu? Tiến trình đã lưu sẽ bị xoá.')) { clearSave(); newGame(); } };
document.addEventListener('visibilitychange', () => { if (document.hidden && S && !S.over && !S.paused) $('pause').click(); });

// ?wave=N&coins=M jumps ahead (handy for trying bosses); ?max=N&kinds=a,b,.. adds max-level critters
const qs = new URLSearchParams(location.search);

// ---------- save / load (localStorage) ----------
// Zombies in flight are not saved: reloading mid-wave replays that wave from its start.
const SAVE_KEY = 'cd2-save';
const noSave = qs.has('wave') || qs.has('max') || qs.has('legend');
function saveGame() {
  if (!S || S.over || noSave) return;
  const data = {
    v: 1, wave: waveActive() ? S.wave - 1 : S.wave, coins: S.coins, gate: S.gate, summons: S.summons,
    layout: S.layout, benchN: S.benchN, auto: S.auto, speed: S.speed, hintFuse: !!S.hintFuse,
    grid: S.grid.map(c => !c ? null : isCrit(c)
      ? (c.legend ? { lg: c.kinds, star: c.star } : { k: c.kind, l: c.lvl, pick: c.pick ? 1 : 0 })
      : { t: c.type, hp: c.hp, max: c.max, gold: c.gold }),
  };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {}
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function loadGame() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  if (!d || d.v !== 1) return false;
  newGame();
  Object.assign(S, { wave: d.wave, coins: d.coins, gate: d.gate, summons: d.summons, auto: d.auto, speed: d.speed || 1, hintFuse: d.hintFuse });
  S.layout = Math.min(d.layout || 0, LAYOUTS.length - 1); S.benchN = Math.min(d.benchN || 0, MAX_BENCH);
  applyLayout(S.layout, S.benchN);
  S.grid = SLOTS.map((_, i) => {
    const o = d.grid[i];
    if (!o) return null;
    if (o.lg) return legendOf(o.lg, Math.min(o.star, MAX_STAR));
    if (o.k && TYPES[o.k]) { const c = critter(Math.min(o.l, MAXL), o.k); if (o.pick) needPick(c); return c; }
    if (o.t) return { type: o.t, hp: o.hp, max: o.max, gold: o.gold, shake: 0, pop: 1 };
    return null;
  });
  $('speed').textContent = 'x' + S.speed;
  setTimeout(openChoice, 600);
  banner(S.wave ? `Chơi tiếp từ wave ${S.wave + 1}` : 'Chơi tiếp', 2.5);
  hud();
  return true;
}
setInterval(saveGame, 3000);
window.addEventListener('pagehide', saveGame);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });

// ---------- loop ----------
let last = performance.now(), hudT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!S.paused && !S.over && !choosing) {
    for (let k = 0; k < S.speed; k++) update(dt);
  } else if (S.over) {
    for (const p of S.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  }
  if ((hudT += dt) > .25) { hudT = 0; hud(); }
  render();
  requestAnimationFrame(frame);
}
resize(); if (noSave || !loadGame()) newGame();
if (qs.has('wave')) { S.wave = Math.max(0, +qs.get('wave') - 1); S.coins = +qs.get('coins') || S.coins; hud(); }
if (qs.has('legend')) {   // ?legend=chili+ice,sword+sword&star=12 drops legends to preview star tiers
  qs.get('legend').split(',').forEach((key, n) => { const e = emptySlots(); if (e.length) S.grid[e[0]] = legendOf(key.split(/[+: ]/), Math.min(MAX_STAR, +qs.get('star') || 1 + n * 5)); });
}
if (qs.has('max')) {   // ?max=N drops N max-level critters on the field
  for (let n = 0; n < +qs.get('max'); n++) { const e = emptySlots(); if (e.length) S.grid[e[0]] = critter(Math.min(MAXL, +qs.get('lvl') || MAXL), (qs.get('kinds') || '').split(',')[n] || rollKind()); }
}
requestAnimationFrame(frame);
})();
</script>
