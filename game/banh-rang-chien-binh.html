<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Bánh Răng Chiến Binh</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{ --bg:#2a1d12; }
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center;font-family:'Nunito',system-ui,sans-serif}
canvas{display:block;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
a.back{position:fixed;top:8px;left:10px;color:#f5deb3;font-weight:800;text-decoration:none;font-size:14px;opacity:.75;z-index:2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
const W = 450, H = 800;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize(){
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = W*scale + 'px'; cv.style.height = H*scale + 'px';
  cv.width = W*scale*dpr; cv.height = H*scale*dpr;
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
}
addEventListener('resize', resize); resize();

// ---------- Config ----------
const COLS = 6, ROWS = 4, CELL = 70, BX = 15, BY = 62;
const CORE = {c:2, r:2};
const GROUND = 612, HERO_X = 78;
const MULT = [0, 1, 2.3, 5, 11];
const MAXLV = 4;
const TYPES = {
  sword:  {name:'Kiếm',   icon:'🗡️', col:'#f5b335', dark:'#b3701a', cd:1.8, desc:'Phóng kiếm'},
  shield: {name:'Khiên',  icon:'🛡️', col:'#3f86e8', dark:'#1f4f9c', cd:3.4, desc:'+Giáp'},
  heart:  {name:'Hồi máu',icon:'❤️', col:'#b37be0', dark:'#6e3c9c', cd:3.0, desc:'Hồi máu'},
  meat:   {name:'Thịt',   icon:'🍖', col:'#6fcf4e', dark:'#2f8a25', cd:0,   desc:'+Máu tối đa'},
  star:   {name:'Sấm sét',icon:'⭐', col:'#ec3f86', dark:'#9c1f55', cd:6.5, desc:'Sét đánh tất cả'},
};
const TYPE_KEYS = Object.keys(TYPES);

// ---------- State ----------
let S;
let best = 0;
try { best = +localStorage.getItem('brcb_best') || 0; } catch(e){}

function newGame(){
  S = {
    board: Array.from({length:ROWS}, () => Array(COLS).fill(null)),
    gold: 12, wave: 0, waveTimer: 1.5, spawnQueue: [], spawnT: 0,
    hero: {hp:100, maxHp:100, shield:0, atkT:0, hurt:0, bob:0, swing:0},
    enemies: [], projs: [], parts: [], texts: [], bolts: [],
    shop: [], over: false, started: S ? true : false, time: 0, kills: 0, selected: -1,
  };
  S.board[CORE.r][CORE.c] = {type:'core', lv:1, angle:0};
  // starter gears
  S.board[CORE.r][CORE.c+1] = mkGear('sword', 1);
  S.board[CORE.r-1][CORE.c] = mkGear('heart', 1);
  rollShop(true);
}
function mkGear(type, lv){ return {type, lv, t:0, angle:Math.random()*6, flash:0}; }
function gearCost(lv){ return lv === 1 ? 3 : 8; }
function rollShop(free){
  S.shop = [];
  for (let i=0;i<3;i++){
    const lv = (S.wave >= 6 && Math.random() < Math.min(0.35, 0.05*(S.wave-5))) ? 2 : 1;
    S.shop.push({type: TYPE_KEYS[Math.floor(Math.random()*TYPE_KEYS.length)], lv, sold:false});
  }
  S.selected = -1;
}

// ---------- Board helpers ----------
const cellXY = (c, r) => ({x: BX + c*CELL + CELL/2, y: BY + r*CELL + CELL/2});
function cellAt(x, y){
  const c = Math.floor((x - BX)/CELL), r = Math.floor((y - BY)/CELL);
  if (c<0||r<0||c>=COLS||r>=ROWS) return null;
  return {c, r};
}
function computePower(){
  const pw = Array.from({length:ROWS}, () => Array(COLS).fill(false));
  const q = [[CORE.c, CORE.r]]; pw[CORE.r][CORE.c] = true;
  while (q.length){
    const [c, r] = q.shift();
    for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nc=c+dc, nr=r+dr;
      if (nc<0||nr<0||nc>=COLS||nr>=ROWS||pw[nr][nc]||!S.board[nr][nc]) continue;
      pw[nr][nc] = true; q.push([nc, nr]);
    }
  }
  return pw;
}
function sameNeighbors(c, r, type, pw){
  let n = 0;
  for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const g = S.board[r+dr]?.[c+dc];
    if (g && g.type === type && pw[r+dr][c+dc]) n++;
  }
  return n;
}

// ---------- Waves ----------
function startWave(){
  S.wave++;
  const n = 4 + Math.floor(S.wave * 1.6);
  S.spawnQueue = [];
  for (let i=0;i<n;i++){
    let kind = 'soldier';
    if (S.wave >= 3 && Math.random() < 0.25) kind = 'archer';
    if (S.wave >= 5 && Math.random() < 0.18) kind = 'brute';
    S.spawnQueue.push(kind);
  }
  if (S.wave % 5 === 0) S.spawnQueue.push('boss');
  S.spawnT = 0.3;
  addText(W/2, 400, 'ĐỢT ' + S.wave, '#fff3c4', 34, 1.6);
}
function spawn(kind){
  const k = 1.17 ** (S.wave - 1), d = 1.11 ** (S.wave - 1);
  const base = {
    soldier:{hp:18, dmg:3,  spd:42, r:15, gold:1, range:0},
    archer: {hp:12, dmg:4,  spd:38, r:14, gold:2, range:170},
    brute:  {hp:60, dmg:7,  spd:30, r:20, gold:3, range:0},
    boss:   {hp:260,dmg:14, spd:24, r:30, gold:15, range:0},
  }[kind];
  S.enemies.push({kind, x: W + 30 + Math.random()*20, y: GROUND + (Math.random()*10-5),
    hp: base.hp*k, maxHp: base.hp*k, dmg: base.dmg*d, spd: base.spd*(0.9+Math.random()*0.2),
    r: base.r, gold: base.gold, range: base.range, atkT: Math.random()*0.5, hurt:0, walk:Math.random()*6,
    hue: Math.random()});
}

// ---------- Effects ----------
function addText(x, y, s, col, size=18, life=0.9){ S.texts.push({x, y, s, col, size, life, max:life}); }
function burst(x, y, col, n=8, spd=120){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = spd*(0.4+Math.random()*0.8);
    S.parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 40, life:0.5+Math.random()*0.3, col, r:2+Math.random()*3});
  }
}
function frontEnemy(){
  let best = null;
  for (const e of S.enemies) if (e.hp > 0 && (!best || e.x < best.x)) best = e;
  return best;
}
function damageEnemy(e, dmg, col='#fff'){
  if (e.hp <= 0) return;
  e.hp -= dmg; e.hurt = 0.15;
  addText(e.x + (Math.random()*16-8), e.y - e.r*2 - 18, Math.round(dmg), col, 17);
  if (e.hp <= 0){
    S.gold += e.gold; S.kills++;
    burst(e.x, e.y - e.r, '#ffd54a', 10, 140);
    addText(e.x, e.y - e.r*2 - 36, '+' + e.gold + '🪙', '#ffe27a', 15);
  }
}
function damageHero(dmg){
  const h = S.hero;
  if (h.shield > 0){
    const a = Math.min(h.shield, dmg); h.shield -= a; dmg -= a;
    if (a > 0) burst(HERO_X+20, GROUND-50, '#7fb8ff', 3, 80);
  }
  if (dmg > 0){ h.hp -= dmg; h.hurt = 0.2; addText(HERO_X, GROUND - 110, '-' + Math.round(dmg), '#ff6b6b', 16); }
  if (h.hp <= 0 && !S.over){
    h.hp = 0; S.over = true;
    if (S.wave > best){ best = S.wave; try { localStorage.setItem('brcb_best', best); } catch(e){} }
  }
}
function fireGear(g, x, y){
  const m = MULT[g.lv], h = S.hero;
  g.flash = 0.35;
  if (g.type === 'sword'){
    const t = frontEnemy();
    if (!t) { g.t = TYPES.sword.cd * 0.8; g.flash = 0; return; }
    S.projs.push({kind:'blade', x, y, tx:t, dmg: 9*m, t:0, sx:x, sy:y, ang:0});
  } else if (g.type === 'shield'){
    const add = 9*m;
    h.shield = Math.min(h.maxHp*0.75, h.shield + add);
    S.projs.push({kind:'orb', x, y, col:'#6fb0ff', icon:'🛡️', t:0, sx:x, sy:y});
    addText(HERO_X, GROUND - 130, '+' + Math.round(add) + '🛡️', '#9cc8ff', 15);
  } else if (g.type === 'heart'){
    if (h.hp >= h.maxHp) { g.t = TYPES.heart.cd * 0.85; g.flash = 0; return; }
    const add = 10*m;
    h.hp = Math.min(h.maxHp, h.hp + add);
    S.projs.push({kind:'orb', x, y, col:'#e08cff', icon:'❤️', t:0, sx:x, sy:y});
    addText(HERO_X, GROUND - 130, '+' + Math.round(add) + '❤️', '#7dff8a', 15);
  } else if (g.type === 'star'){
    const alive = S.enemies.filter(e => e.hp > 0);
    if (!alive.length) { g.t = TYPES.star.cd * 0.9; g.flash = 0; return; }
    for (const e of alive){
      S.bolts.push({x: e.x, y: e.y - e.r, life: 0.3, seed: Math.random()*1000});
      damageEnemy(e, 7*m, '#ffd1f0');
    }
  }
}

// ---------- Update ----------
function update(dt){
  S.time += dt;
  const h = S.hero;
  const pw = computePower();

  // gears
  let maxHp = 100, regen = 0;
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    const g = S.board[r][c]; if (!g) continue;
    const powered = pw[r][c];
    g.flash = Math.max(0, (g.flash||0) - dt);
    if (!powered) continue;
    g.angle += dt * 1.4 * (((c + r) % 2) ? -1 : 1);
    if (g.type === 'core') continue;
    if (g.type === 'meat'){ maxHp += 25*MULT[g.lv]; regen += 0.8*MULT[g.lv]; continue; }
    if (S.over || !S.started) continue;
    const spd = 1 + 0.2*sameNeighbors(c, r, g.type, pw);
    g.t += dt * spd;
    if (g.t >= TYPES[g.type].cd){ g.t = 0; const p = cellXY(c, r); fireGear(g, p.x, p.y); }
  }
  if (maxHp > h.maxHp) h.hp += maxHp - h.maxHp;
  h.maxHp = maxHp; h.hp = Math.min(h.hp, h.maxHp);
  if (!S.over) h.hp = Math.min(h.maxHp, h.hp + regen*dt);
  h.hurt = Math.max(0, h.hurt - dt); h.swing = Math.max(0, h.swing - dt);
  h.bob += dt;

  if (!S.started || S.over) { updateFx(dt); return; }

  // waves
  if (S.spawnQueue.length){
    S.spawnT -= dt;
    if (S.spawnT <= 0){ spawn(S.spawnQueue.shift()); S.spawnT = 0.55 + Math.random()*0.6; }
  } else if (!S.enemies.some(e => e.hp > 0)){
    if (S.wave > 0 && S.waveTimer === null){
      const bonus = 3 + S.wave;
      S.gold += bonus; addText(W/2, 450, 'Hoàn thành! +' + bonus + '🪙', '#ffe27a', 22, 1.5);
      rollShop(true);
      S.waveTimer = 3.5;
    }
    if (S.waveTimer === null) S.waveTimer = 1;
    S.waveTimer -= dt;
    if (S.waveTimer <= 0){ S.waveTimer = null; startWave(); }
  }

  // enemies
  const alive = S.enemies.filter(e => e.hp > 0).sort((a,b) => a.x - b.x);
  let prevX = -1e9;
  for (const e of alive){
    const stopAt = e.range ? HERO_X + 40 + e.range : HERO_X + 32 + e.r;
    const blockAt = prevX + 22;
    const target = Math.max(stopAt, blockAt);
    if (e.x > target){ e.x = Math.max(target, e.x - e.spd*dt); e.walk += dt*8; }
    prevX = e.range ? prevX : e.x;
    e.hurt = Math.max(0, e.hurt - dt);
    const inRange = e.range ? e.x <= stopAt + 2 : e.x <= HERO_X + 40 + e.r;
    if (inRange){
      e.atkT += dt;
      if (e.atkT >= (e.range ? 1.6 : 1.1)){
        e.atkT = 0;
        if (e.range) S.projs.push({kind:'arrow', x:e.x-10, y:e.y-e.r-6, sx:e.x-10, sy:e.y-e.r-6, t:0, dmg:e.dmg});
        else { damageHero(e.dmg); e.lunge = 0.15; }
      }
    }
    e.lunge = Math.max(0, (e.lunge||0) - dt);
  }
  // hero melee
  h.atkT += dt;
  const fe = alive[0];
  if (fe && fe.x <= HERO_X + 60 + fe.r && h.atkT >= 0.7){
    h.atkT = 0; h.swing = 0.25;
    damageEnemy(fe, 4 + S.wave*0.8, '#fff');
  }
  S.enemies = S.enemies.filter(e => e.hp > 0 || false);

  // projectiles
  for (const p of S.projs){
    p.t += dt;
    if (p.kind === 'blade'){
      const t = p.tx.hp > 0 ? p.tx : frontEnemy();
      if (!t){ p.dead = true; continue; }
      p.tx = t;
      const tx = t.x, ty = t.y - t.r, k = Math.min(1, p.t / 0.45);
      const mx = (p.sx + tx)/2, my = Math.min(p.sy, ty) - 60;
      p.x = (1-k)**2*p.sx + 2*(1-k)*k*mx + k*k*tx;
      p.y = (1-k)**2*p.sy + 2*(1-k)*k*my + k*k*ty;
      p.ang += dt*18;
      if (k >= 1){ p.dead = true; damageEnemy(t, p.dmg, '#ffd27a'); burst(tx, ty, '#ffcf6a', 6); }
    } else if (p.kind === 'orb'){
      const k = Math.min(1, p.t / 0.5), tx = HERO_X, ty = GROUND - 50;
      p.x = p.sx + (tx - p.sx)*k; p.y = p.sy + (ty - p.sy)*k - Math.sin(k*Math.PI)*40;
      if (k >= 1){ p.dead = true; burst(tx, ty, p.col, 8); }
    } else if (p.kind === 'arrow'){
      const k = Math.min(1, p.t / 0.6), tx = HERO_X + 10, ty = GROUND - 45;
      p.x = p.sx + (tx - p.sx)*k; p.y = p.sy + (ty - p.sy)*k - Math.sin(k*Math.PI)*50;
      if (k >= 1){ p.dead = true; damageHero(p.dmg); }
    }
  }
  S.projs = S.projs.filter(p => !p.dead);
  updateFx(dt);
}
function updateFx(dt){
  for (const p of S.parts){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 300*dt; p.life -= dt; }
  S.parts = S.parts.filter(p => p.life > 0);
  for (const t of S.texts){ t.y -= 30*dt; t.life -= dt; }
  S.texts = S.texts.filter(t => t.life > 0);
  for (const b of S.bolts) b.life -= dt;
  S.bolts = S.bolts.filter(b => b.life > 0);
}

// ---------- Drawing ----------
function gearPath(x, y, R, teeth, ang){
  ctx.beginPath();
  const n = teeth*2, inner = R*0.8;
  for (let i=0;i<=n*2;i++){
    const a = ang + (i/(n*2))*Math.PI*2;
    const tooth = Math.floor(i/2) % 2 === 0;
    const rr = tooth ? R : inner;
    ctx.lineTo(x + Math.cos(a)*rr, y + Math.sin(a)*rr);
  }
  ctx.closePath();
}
function drawGear(g, x, y, R, powered, alpha=1){
  ctx.save(); ctx.globalAlpha = alpha;
  const T = g.type === 'core' ? {col:'#ffcf1f', dark:'#a8760a'} : TYPES[g.type];
  const col = powered ? T.col : '#9a948a', dark = powered ? T.dark : '#5c574f';
  const pulse = g.flash ? 1 + g.flash*0.35 : 1;
  R *= pulse;
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  gearPath(x+2, y+4, R, 8, g.angle||0); ctx.fill();
  gearPath(x, y, R, 8, g.angle||0);
  ctx.fillStyle = col; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#1d1712'; ctx.stroke();
  // inner disc
  ctx.beginPath(); ctx.arc(x, y, R*0.6, 0, Math.PI*2);
  ctx.fillStyle = dark; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y-1, R*0.54, 0, Math.PI*2);
  const gr = ctx.createRadialGradient(x-R*0.2, y-R*0.25, 2, x, y, R*0.6);
  gr.addColorStop(0, '#fff8'); gr.addColorStop(1, col);
  ctx.fillStyle = gr; ctx.fill();
  if (g.type === 'core'){
    ctx.save(); ctx.translate(x, y); ctx.rotate(-(g.angle||0)*2);
    ctx.strokeStyle = '#6b4705'; ctx.lineWidth = 3;
    for (let i=0;i<6;i++){ ctx.beginPath(); ctx.moveTo(-R*0.35, -R*0.3 + i*R*0.12); ctx.lineTo(R*0.35, -R*0.36 + i*R*0.12); ctx.stroke(); }
    ctx.restore();
  } else {
    ctx.font = `${Math.round(R*0.75)}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (!powered) ctx.globalAlpha = alpha*0.55;
    ctx.fillText(T.icon, x, y+2);
    ctx.globalAlpha = alpha;
    // level pips
    if (g.lv > 1){
      ctx.font = '900 13px Nunito, sans-serif';
      ctx.fillStyle = '#1d1712';
      ctx.beginPath(); ctx.arc(x + R*0.62, y - R*0.62, 10, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffe27a'; ctx.fillText(g.lv, x + R*0.62, y - R*0.62 + 1);
    }
  }
  ctx.restore();
}
function drawCooldown(g, x, y, R){
  const cd = TYPES[g.type].cd; if (!cd) return;
  ctx.beginPath(); ctx.arc(x, y, R*0.66, -Math.PI/2, -Math.PI/2 + Math.PI*2*(g.t/cd));
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3; ctx.stroke();
}

function drawBackground(){
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, '#c9a24a'); sky.addColorStop(0.55, '#e3b766'); sky.addColorStop(1, '#f0c27f');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // far mesas
  ctx.fillStyle = '#c98a4a';
  ctx.beginPath(); ctx.moveTo(0, 520);
  ctx.lineTo(40, 470); ctx.lineTo(120, 470); ctx.lineTo(150, 500); ctx.lineTo(230, 420);
  ctx.lineTo(300, 420); ctx.lineTo(350, 480); ctx.lineTo(410, 450); ctx.lineTo(W, 460); ctx.lineTo(W, 600); ctx.lineTo(0, 600); ctx.fill();
  ctx.fillStyle = '#b06f38';
  ctx.beginPath(); ctx.moveTo(0, 560); ctx.lineTo(70, 520); ctx.lineTo(160, 545); ctx.lineTo(260, 505);
  ctx.lineTo(360, 540); ctx.lineTo(W, 515); ctx.lineTo(W, 620); ctx.lineTo(0, 620); ctx.fill();
  // ground
  const gg = ctx.createLinearGradient(0, GROUND-30, 0, H);
  gg.addColorStop(0, '#f2bf72'); gg.addColorStop(1, '#d99a4f');
  ctx.fillStyle = gg; ctx.fillRect(0, GROUND - 30, W, H);
  // cactus
  ctx.fillStyle = '#7a8a3a';
  ctx.fillRect(385, 540, 12, 50); ctx.fillRect(373, 555, 10, 22); ctx.fillRect(399, 548, 10, 20);
  ctx.fillRect(373, 568, 14, 7); ctx.fillRect(397, 562, 12, 7);
  // broken gear prop
  ctx.save(); ctx.globalAlpha = 0.6; ctx.fillStyle = '#8c8c8c';
  gearPath(40, 585, 22, 7, 0.4); ctx.fill(); ctx.restore();
  // board panel
  ctx.fillStyle = 'rgba(60,35,10,.22)';
  roundRect(BX-6, BY-6, COLS*CELL+12, ROWS*CELL+12, 18); ctx.fill();
}
function roundRect(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}

function drawHero(){
  const h = S.hero, x = HERO_X, y = GROUND;
  const bob = Math.sin(h.bob*4)*2;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(x, y+2, 34, 8, 0, 0, Math.PI*2); ctx.fill();
  if (h.hurt > 0) ctx.filter = 'brightness(1.8)';
  // legs
  ctx.fillStyle = '#5a3a20';
  ctx.fillRect(x-16, y-22, 11, 20); ctx.fillRect(x+4, y-22, 11, 20);
  ctx.fillStyle = '#3b2512'; ctx.fillRect(x-18, y-6, 15, 7); ctx.fillRect(x+3, y-6, 15, 7);
  // body
  ctx.fillStyle = '#2f5fb3';
  roundRect(x-22, y-56+bob, 44, 38, 10); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#1d1712'; ctx.stroke();
  ctx.fillStyle = '#f6c34a'; ctx.fillRect(x-22, y-30+bob, 44, 6);
  // head
  ctx.fillStyle = '#f7a35c';
  ctx.beginPath(); ctx.arc(x+2, y-78+bob, 26, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  // helmet
  ctx.fillStyle = '#3f86e8';
  ctx.beginPath(); ctx.arc(x+2, y-82+bob, 28, Math.PI*1.02, Math.PI*1.98); ctx.lineTo(x+30, y-76+bob); ctx.lineTo(x-26, y-76+bob); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e94b3c';
  ctx.beginPath(); ctx.ellipse(x-4, y-112+bob, 22, 8, -0.2, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  // eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(x+6, y-72+bob, 6, 7, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+20, y-72+bob, 6, 7, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1d1712';
  ctx.beginPath(); ctx.arc(x+8, y-71+bob, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+22, y-71+bob, 3, 0, Math.PI*2); ctx.fill();
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x+1, y-82+bob); ctx.lineTo(x+12, y-79+bob); ctx.moveTo(x+27, y-82+bob); ctx.lineTo(x+16, y-79+bob); ctx.stroke();
  ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x+15, y-62+bob, 5, 0.2, Math.PI-0.2); ctx.stroke();
  // spear
  const sw = h.swing > 0 ? Math.sin((h.swing/0.25)*Math.PI) : 0;
  ctx.save(); ctx.translate(x+26, y-40+bob); ctx.rotate(-0.25 + sw*1.2);
  ctx.strokeStyle = '#6b4520'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(0, -60 - sw*10); ctx.stroke();
  ctx.fillStyle = '#c9d2dc'; ctx.strokeStyle = '#1d1712'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-7, -58 - sw*10); ctx.lineTo(0, -80 - sw*10); ctx.lineTo(7, -58 - sw*10); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
  // fist
  ctx.fillStyle = '#f7a35c'; ctx.beginPath(); ctx.arc(x+26, y-38+bob, 7, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#1d1712'; ctx.stroke();
  ctx.restore();
  // hp bars
  const bw = 110, bx = x - 45, by = GROUND - 150;
  ctx.fillStyle = '#1d1712'; roundRect(bx-2, by-2, bw+4, 16, 8); ctx.fill();
  ctx.fillStyle = '#4a1f1f'; roundRect(bx, by, bw, 12, 6); ctx.fill();
  ctx.fillStyle = '#4fd65a'; roundRect(bx, by, Math.max(0, bw*h.hp/h.maxHp), 12, 6); ctx.fill();
  if (h.shield > 0){
    ctx.fillStyle = '#5aa8ff';
    roundRect(bx, by-10, Math.min(bw, bw*h.shield/h.maxHp), 7, 3); ctx.fill();
  }
  ctx.font = '900 11px Nunito, sans-serif'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(Math.ceil(h.hp) + ' / ' + Math.round(h.maxHp), bx + bw/2, by + 7);
}

function drawEnemy(e){
  const s = e.r / 15, x = e.x - (e.lunge ? 10 : 0), y = e.y;
  const step = Math.sin(e.walk)*3;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(x, y+2, e.r*1.1, 5*s, 0, 0, Math.PI*2); ctx.fill();
  if (e.hurt > 0) ctx.filter = 'brightness(2)';
  ctx.lineWidth = 2.5; ctx.strokeStyle = '#1d1712';
  // legs
  ctx.fillStyle = '#4a2c18';
  ctx.fillRect(x-8*s, y-10*s + step*0.3, 6*s, 10*s); ctx.fillRect(x+2*s, y-10*s - step*0.3, 6*s, 10*s);
  // body
  const bodyCol = e.kind === 'boss' ? '#6d2b8f' : e.kind === 'brute' ? '#7a4b2a' : e.kind === 'archer' ? '#3f7a3a' : '#a8322a';
  ctx.fillStyle = bodyCol;
  roundRect(x-11*s, y-26*s, 22*s, 18*s, 5*s); ctx.fill(); ctx.stroke();
  // head
  ctx.fillStyle = e.hue > 0.5 ? '#f2a466' : '#d98c52';
  ctx.beginPath(); ctx.arc(x, y-36*s, 13*s, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  // helmet
  ctx.fillStyle = e.kind === 'boss' ? '#d4a017' : '#8c7b6a';
  ctx.beginPath(); ctx.arc(x, y-39*s, 14*s, Math.PI, Math.PI*2); ctx.closePath(); ctx.fill(); ctx.stroke();
  if (e.kind === 'boss'){
    ctx.fillStyle = '#ffd84a';
    ctx.beginPath(); ctx.moveTo(x-12*s, y-50*s); ctx.lineTo(x-8*s, y-62*s); ctx.lineTo(x-3*s, y-52*s); ctx.lineTo(x, y-64*s);
    ctx.lineTo(x+3*s, y-52*s); ctx.lineTo(x+8*s, y-62*s); ctx.lineTo(x+12*s, y-50*s); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else {
    ctx.fillStyle = '#c4302b';
    ctx.beginPath(); ctx.ellipse(x+2*s, y-55*s, 11*s, 5*s, 0.2, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  }
  // eyes (angry, facing left)
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x-6*s, y-34*s, 3.5*s, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+2*s, y-34*s, 3.5*s, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1d1712';
  ctx.beginPath(); ctx.arc(x-7*s, y-34*s, 1.8*s, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+1*s, y-34*s, 1.8*s, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x-10*s, y-40*s); ctx.lineTo(x-3*s, y-38*s); ctx.moveTo(x+6*s, y-40*s); ctx.lineTo(x-1*s, y-38*s); ctx.stroke();
  // weapon
  if (e.kind === 'archer'){
    ctx.strokeStyle = '#6b4520'; ctx.lineWidth = 3*s;
    ctx.beginPath(); ctx.arc(x-14*s, y-22*s, 12*s, Math.PI*0.6, Math.PI*1.4); ctx.stroke();
    ctx.strokeStyle = '#eee'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x-18*s, y-33*s); ctx.lineTo(x-18*s, y-11*s); ctx.stroke();
  } else if (e.kind === 'brute' || e.kind === 'boss'){
    ctx.save(); ctx.translate(x-12*s, y-22*s); ctx.rotate(-0.5 - (e.lunge ? 0.8 : 0));
    ctx.fillStyle = '#6b4520'; ctx.fillRect(-2*s, -24*s, 4*s, 26*s);
    ctx.fillStyle = '#8f9aa5'; ctx.beginPath(); ctx.arc(0, -24*s, 7*s, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.restore();
  } else {
    ctx.strokeStyle = '#6b4520'; ctx.lineWidth = 3*s;
    ctx.beginPath(); ctx.moveTo(x-12*s, y-2*s); ctx.lineTo(x-14*s, y-48*s); ctx.stroke();
    ctx.fillStyle = '#c9d2dc'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x-18*s, y-46*s); ctx.lineTo(x-14.5*s, y-58*s); ctx.lineTo(x-11*s, y-46*s); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
  // hp bar
  if (e.hp < e.maxHp){
    const bw = e.r*2.2;
    ctx.fillStyle = '#1d1712'; ctx.fillRect(x - bw/2 - 1, y - e.r*4.4 - 1, bw+2, 6);
    ctx.fillStyle = '#ff5050'; ctx.fillRect(x - bw/2, y - e.r*4.4, bw*Math.max(0, e.hp/e.maxHp), 4);
  }
}

function drawBoard(pw){
  // connections
  ctx.strokeStyle = 'rgba(255,230,150,.35)'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    if (!pw[r][c]) continue;
    const a = cellXY(c, r);
    for (const [dc, dr] of [[1,0],[0,1]]){
      if (pw[r+dr]?.[c+dc]){ const b = cellXY(c+dc, r+dr); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    }
  }
  const hoverCell = drag && drag.moved ? cellAt(drag.x, drag.y) : null;
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    const {x, y} = cellXY(c, r), g = S.board[r][c];
    if (!g || (drag && drag.src === 'board' && drag.c === c && drag.r === r)){
      ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = '#7a5a2a';
      gearPath(x, y, 13, 6, 0); ctx.fill(); ctx.restore();
    } else {
      drawGear(g, x, y, CELL*0.47, pw[r][c]);
      if (g.type !== 'core' && pw[r][c]) drawCooldown(g, x, y, CELL*0.47);
    }
    if (hoverCell && hoverCell.c === c && hoverCell.r === r){
      const ok = canDrop(c, r);
      ctx.strokeStyle = ok ? 'rgba(255,255,255,.9)' : 'rgba(255,80,80,.8)'; ctx.lineWidth = 3;
      roundRect(x - CELL/2 + 3, y - CELL/2 + 3, CELL - 6, CELL - 6, 12); ctx.stroke();
    }
    if (S.selected >= 0 && !g){
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.4 + 0.3*Math.sin(S.time*6)) + ')'; ctx.lineWidth = 2;
      roundRect(x - CELL/2 + 6, y - CELL/2 + 6, CELL - 12, CELL - 12, 10); ctx.stroke();
    }
  }
}

const SHOP_Y = 655, CARD_W = 104, CARD_H = 128, CARD_GAP = 10;
const cardX = i => 15 + i*(CARD_W + CARD_GAP);
const REROLL = {x: 15 + 3*(CARD_W+CARD_GAP), y: SHOP_Y, w: 420 - 3*(CARD_W+CARD_GAP), h: CARD_H};

function drawShop(){
  ctx.fillStyle = 'rgba(40,24,10,.75)';
  roundRect(6, SHOP_Y - 12, W - 12, CARD_H + 24, 18); ctx.fill();
  const selling = drag && drag.src === 'board' && drag.moved && drag.y > SHOP_Y - 20;
  if (selling){
    ctx.fillStyle = 'rgba(220,60,60,.85)'; roundRect(6, SHOP_Y - 12, W - 12, CARD_H + 24, 18); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '900 24px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Thả để bán: +' + sellValue(drag.gear) + '🪙', W/2, SHOP_Y + CARD_H/2);
    return;
  }
  S.shop.forEach((it, i) => {
    const x = cardX(i), y = SHOP_Y, cost = gearCost(it.lv), afford = S.gold >= cost;
    ctx.fillStyle = it.sold ? 'rgba(255,255,255,.08)' : (S.selected === i ? '#fff3c4' : '#f6e7c8');
    roundRect(x, y, CARD_W, CARD_H, 14); ctx.fill();
    if (it.sold) return;
    if (drag && drag.src === 'shop' && drag.idx === i && drag.moved) { ctx.globalAlpha = 1; return; }
    const T = TYPES[it.type];
    drawGear({type: it.type, lv: it.lv, angle: S.time*0.6}, x + CARD_W/2, y + 46, 30, true, afford ? 1 : 0.5);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#3a2614'; ctx.font = '800 13px Nunito, sans-serif';
    ctx.fillText(T.desc, x + CARD_W/2, y + 90);
    ctx.fillStyle = afford ? '#2f8a25' : '#b33';
    roundRect(x + 18, y + 102, CARD_W - 36, 20, 10); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '900 13px Nunito, sans-serif';
    ctx.fillText(cost + ' 🪙', x + CARD_W/2, y + 113);
  });
  const R = REROLL, ok = S.gold >= 1;
  ctx.fillStyle = ok ? '#3f86e8' : '#555';
  roundRect(R.x, R.y, R.w, R.h, 14); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '26px serif'; ctx.fillText('🔄', R.x + R.w/2, R.y + 44);
  ctx.font = '900 13px Nunito, sans-serif'; ctx.fillText('Đổi', R.x + R.w/2, R.y + 80);
  ctx.fillText('1 🪙', R.x + R.w/2, R.y + 100);
}

function drawHUD(){
  ctx.fillStyle = 'rgba(40,24,10,.6)'; roundRect(10, 10, W - 20, 42, 14); ctx.fill();
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.font = '900 18px Nunito, sans-serif'; ctx.fillStyle = '#ffe27a';
  ctx.font = '18px serif'; ctx.fillText('🏠', 20, 31);
  ctx.font = '900 18px Nunito, sans-serif'; ctx.fillText('🪙 ' + S.gold, 54, 31);
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.fillText('Đợt ' + Math.max(1, S.wave), W/2, 31);
  ctx.textAlign = 'right'; ctx.fillStyle = '#f5deb3'; ctx.font = '800 14px Nunito, sans-serif';
  ctx.fillText('Kỷ lục: ' + best, W - 24, 31);
}

function drawOverlay(title, lines, btn){
  ctx.fillStyle = 'rgba(20,12,4,.72)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff6e0'; roundRect(30, 170, W - 60, 420, 22); ctx.fill();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#3a2614'; ctx.font = '900 30px Nunito, sans-serif';
  ctx.fillText(title, W/2, 215);
  ctx.font = '700 15px Nunito, sans-serif'; ctx.fillStyle = '#5a4026';
  lines.forEach((l, i) => ctx.fillText(l, W/2, 262 + i*26));
  ctx.fillStyle = '#e9762b'; roundRect(W/2 - 100, 520, 200, 50, 25); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '900 20px Nunito, sans-serif'; ctx.fillText(btn, W/2, 546);
}

function draw(){
  drawBackground();
  const pw = computePower();
  drawBoard(pw);
  // battle
  const list = [...S.enemies].sort((a,b) => a.y - b.y);
  drawHero();
  for (const e of list) drawEnemy(e);
  for (const p of S.projs){
    if (p.kind === 'blade'){
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.ang);
      ctx.font = '22px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🗡️', 0, 0); ctx.restore();
    } else if (p.kind === 'orb'){
      ctx.fillStyle = p.col; ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.arc(p.x, p.y, 14, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
      ctx.font = '16px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p.icon, p.x, p.y);
    } else if (p.kind === 'arrow'){
      ctx.strokeStyle = '#3b2512'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 16, p.y - 2); ctx.stroke();
      ctx.fillStyle = '#ccc'; ctx.beginPath(); ctx.moveTo(p.x - 4, p.y); ctx.lineTo(p.x + 2, p.y - 3); ctx.lineTo(p.x + 2, p.y + 3); ctx.fill();
    }
  }
  for (const b of S.bolts){
    ctx.save(); ctx.globalAlpha = Math.min(1, b.life / 0.15);
    ctx.strokeStyle = '#fff6a8'; ctx.lineWidth = 4; ctx.shadowColor = '#ff6ad5'; ctx.shadowBlur = 14;
    ctx.beginPath(); let x = b.x, y = 330; ctx.moveTo(x, y);
    let s = b.seed;
    while (y < b.y){ s = (s*9301 + 49297) % 233280; y += 22; x = b.x + ((s/233280) - 0.5)*30; ctx.lineTo(x, Math.min(y, b.y)); }
    ctx.stroke(); ctx.restore();
  }
  for (const p of S.parts){ ctx.globalAlpha = Math.max(0, p.life*2); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const t of S.texts){
    ctx.globalAlpha = Math.min(1, t.life / (t.max*0.4));
    ctx.font = `900 ${t.size}px Nunito, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = '#1d1712'; ctx.strokeText(t.s, t.x, t.y);
    ctx.fillStyle = t.col; ctx.fillText(t.s, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  drawShop();
  drawHUD();
  // dragged gear
  if (drag && drag.moved){
    drawGear(drag.gear, drag.x, drag.y, CELL*0.5, true, 0.92);
  }
  // hint for empty/unpowered
  if (S.started && !S.over && S.wave <= 1 && !drag){
    ctx.font = '800 13px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#3a2614';
    ctx.fillText('Kéo bánh răng lên bảng, nối vào lõi vàng ⚙️', W/2, SHOP_Y - 22);
  }
  if (!S.started){
    drawOverlay('⚙️ Bánh Răng Chiến Binh', [
      'Mua bánh răng ở cửa hàng, kéo lên bảng.',
      'Chỉ bánh răng NỐI với lõi vàng mới quay.',
      '🗡️ phóng kiếm · 🛡️ thêm giáp · ❤️ hồi máu',
      '🍖 tăng máu tối đa · ⭐ sét đánh mọi kẻ địch',
      'Thả bánh răng lên cái giống hệt (cùng cấp)',
      'để gộp lên cấp cao hơn (tối đa cấp 4).',
      'Cùng loại đứng cạnh nhau: quay nhanh +20%.',
      'Kéo bánh răng xuống cửa hàng để bán.',
      'Bảo vệ chiến binh càng nhiều đợt càng tốt!',
    ], 'BẮT ĐẦU');
  } else if (S.over){
    drawOverlay('Thất bại!', [
      'Bạn trụ được tới đợt ' + S.wave,
      'Hạ gục ' + S.kills + ' kẻ địch',
      'Kỷ lục: đợt ' + best,
    ], 'CHƠI LẠI');
  }
}

// ---------- Input ----------
let drag = null;
function sellValue(g){ return Math.max(1, Math.floor(gearCost(1) * (2 ** (g.lv-1)) / 2)); }
function canDrop(c, r){
  if (!drag) return false;
  const t = S.board[r][c];
  if (drag.src === 'board' && drag.c === c && drag.r === r) return true;
  if (!t) return true;
  return t.type === drag.gear.type && t.lv === drag.gear.lv && t.lv < MAXLV;
}
function toLocal(ev){
  const rc = cv.getBoundingClientRect();
  return {x: (ev.clientX - rc.left) / scale, y: (ev.clientY - rc.top) / scale};
}
function inRect(p, x, y, w, h){ return p.x >= x && p.x <= x+w && p.y >= y && p.y <= y+h; }

function placeAt(c, r, gear){
  const t = S.board[r][c];
  if (!t){ S.board[r][c] = gear; burstAtCell(c, r, '#fff'); return true; }
  if (t.type === gear.type && t.lv === gear.lv && t.lv < MAXLV){
    t.lv++; t.flash = 0.5; t.t = 0;
    const p = cellXY(c, r); burst(p.x, p.y, TYPES[t.type].col, 16, 160);
    addText(p.x, p.y - 30, 'Cấp ' + t.lv + '!', '#fff3c4', 20);
    return true;
  }
  return false;
}
function burstAtCell(c, r, col){ const p = cellXY(c, r); burst(p.x, p.y, col, 8, 100); }

cv.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  const p = toLocal(ev);
  if (inRect(p, 10, 10, 40, 42)){ location.href = '../index.html'; return; }
  if (!S.started || S.over){
    if (inRect(p, W/2 - 100, 520, 200, 50)){ if (S.over) newGame(); S.started = true; }
    return;
  }
  // shop cards
  for (let i=0;i<3;i++){
    if (inRect(p, cardX(i), SHOP_Y, CARD_W, CARD_H)){
      const it = S.shop[i];
      if (it.sold) return;
      if (S.gold < gearCost(it.lv)){ addText(cardX(i) + CARD_W/2, SHOP_Y - 10, 'Thiếu vàng', '#ff8080', 15); return; }
      drag = {src:'shop', idx:i, gear: mkGear(it.type, it.lv), x:p.x, y:p.y, sx:p.x, sy:p.y, moved:false};
      cv.setPointerCapture(ev.pointerId);
      return;
    }
  }
  if (inRect(p, REROLL.x, REROLL.y, REROLL.w, REROLL.h)){
    if (S.gold >= 1){ S.gold -= 1; rollShop(); }
    return;
  }
  const cell = cellAt(p.x, p.y);
  if (cell){
    const g = S.board[cell.r][cell.c];
    if (!g && S.selected >= 0){
      const it = S.shop[S.selected];
      if (S.gold >= gearCost(it.lv) && placeAt(cell.c, cell.r, mkGear(it.type, it.lv))){
        S.gold -= gearCost(it.lv); it.sold = true;
      }
      S.selected = -1; return;
    }
    if (g && g.type !== 'core'){
      if (S.selected >= 0){
        const it = S.shop[S.selected];
        if (S.gold >= gearCost(it.lv) && placeAt(cell.c, cell.r, mkGear(it.type, it.lv))){ S.gold -= gearCost(it.lv); it.sold = true; }
        S.selected = -1; return;
      }
      drag = {src:'board', c:cell.c, r:cell.r, gear:g, x:p.x, y:p.y, sx:p.x, sy:p.y, moved:false};
      cv.setPointerCapture(ev.pointerId);
    }
  }
  S.selected = -1;
});
cv.addEventListener('pointermove', ev => {
  if (!drag) return;
  const p = toLocal(ev);
  drag.x = p.x; drag.y = p.y;
  if (Math.hypot(p.x - drag.sx, p.y - drag.sy) > 8) drag.moved = true;
});
function endDrag(ev){
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved){
    if (d.src === 'shop') S.selected = (S.selected === d.idx ? -1 : d.idx);
    return;
  }
  const cell = cellAt(d.x, d.y);
  if (d.src === 'shop'){
    const it = S.shop[d.idx];
    if (cell && S.gold >= gearCost(it.lv) && placeAt(cell.c, cell.r, d.gear)){
      S.gold -= gearCost(it.lv); it.sold = true;
    }
  } else {
    if (d.y > SHOP_Y - 20){
      const v = sellValue(d.gear);
      S.board[d.r][d.c] = null; S.gold += v;
      addText(d.x, d.y - 20, '+' + v + '🪙', '#ffe27a', 18);
      return;
    }
    if (!cell || (cell.c === d.c && cell.r === d.r)) return;
    const t = S.board[cell.r][cell.c];
    if (t && t.type === 'core') return;
    S.board[d.r][d.c] = null;
    if (!placeAt(cell.c, cell.r, d.gear)){
      // swap
      S.board[d.r][d.c] = t; S.board[cell.r][cell.c] = d.gear;
    }
  }
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', () => { drag = null; });

// ---------- Loop ----------
newGame();
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
